version: "3.9"

services:
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    image: aero/simulator:latest
    ports:
      - "8001:8001"    # REST
      - "9091:9091"    # Prometheus metrics
    networks:
      - aero-net

  telemetry:
    build:
      context: .
      dockerfile: telemetry/Dockerfile
    image: aero/telemetry:latest
    ports:
      - "9090:9090"
    environment:
      - SIMULATOR_URL=http://simulator:8001
    depends_on:
      - simulator
    networks:
      - aero-net

  forecaster:
    build:
      context: .
      dockerfile: forecaster/Dockerfile
    image: aero/forecaster:latest
    ports:
      - "8002:8002"
    volumes:
      - ./forecaster/models:/app/models
      - ./forecaster/data:/app/data
    networks:
      - aero-net

  power:
    build:
      context: .
      dockerfile: power/Dockerfile
    image: aero/power:latest
    ports:
      - "8003:8003"
    environment:
      - SIMULATOR_URL=http://simulator:8001
    depends_on:
      - simulator
    networks:
      - aero-net

  extender:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    image: aero/extender:latest
    ports:
      - "8080:8080"
    environment:
      - SIMULATOR_URL=http://simulator:8001
    depends_on:
      - simulator
    networks:
      - aero-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: aero/api:latest
    ports:
      - "8000:8000"
    environment:
      - SIMULATOR_URL=http://simulator:8001
      - FORECASTER_URL=http://forecaster:8002
      - POWER_URL=http://power:8003
      - EXTENDER_URL=http://extender:8080
    depends_on:
      - simulator
      - forecaster
      - power
      - extender
    networks:
      - aero-net

networks:
  aero-net:
    driver: bridge
